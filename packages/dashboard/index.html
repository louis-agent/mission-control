<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Mission Control</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet" />
    <style>
      *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

      :root {
        --bg-base:       #07080f;
        --bg-surface:    #0c0e18;
        --bg-elevated:   #12141f;
        --bg-hover:      #181b2a;
        --bg-card:       #0f1120;
        --border:        rgba(255,255,255,0.06);
        --border-strong: rgba(255,255,255,0.12);
        --text-primary:  #e4e7f0;
        --text-secondary:#7a7f96;
        --text-muted:    #3c4055;
        --accent:        #00d4ff;
        --accent-dim:    rgba(0,212,255,0.10);
        --accent-bright: rgba(0,212,255,0.20);
        --green:         #00e5a0;
        --green-dim:     rgba(0,229,160,0.12);
        --amber:         #ffb347;
        --amber-dim:     rgba(255,179,71,0.12);
        --red:           #ff5c5c;
        --red-dim:       rgba(255,92,92,0.12);
        --purple:        #9b5de5;
        --purple-dim:    rgba(155,93,229,0.12);
        --sidebar-width: 220px;
        --topbar-height: 52px;
        --font-ui:       'Syne', sans-serif;
        --font-mono:     'JetBrains Mono', monospace;
      }

      html, body, #root {
        height: 100%;
        background: var(--bg-base);
        color: var(--text-primary);
        font-family: var(--font-ui);
        font-size: 14px;
        line-height: 1.5;
        -webkit-font-smoothing: antialiased;
      }

      ::selection {
        background: var(--accent-bright);
        color: var(--text-primary);
      }

      ::-webkit-scrollbar { width: 6px; height: 6px; }
      ::-webkit-scrollbar-track { background: transparent; }
      ::-webkit-scrollbar-thumb { background: var(--border-strong); border-radius: 3px; }
      ::-webkit-scrollbar-thumb:hover { background: rgba(255,255,255,0.2); }

      body::before {
        content: '';
        position: fixed;
        inset: 0;
        background-image:
          linear-gradient(var(--border) 1px, transparent 1px),
          linear-gradient(90deg, var(--border) 1px, transparent 1px);
        background-size: 40px 40px;
        pointer-events: none;
        z-index: 0;
        opacity: 0.4;
      }

      #root { position: relative; z-index: 1; }

      button { font-family: var(--font-ui); }
      input  { font-family: var(--font-ui); }

      @keyframes pulse-ring {
        0%   { transform: scale(1); opacity: 0.8; }
        100% { transform: scale(2.2); opacity: 0; }
      }
      @keyframes glow-in {
        from { opacity: 0; transform: translateY(8px); }
        to   { opacity: 1; transform: translateY(0); }
      }
      @keyframes blink {
        0%, 100% { opacity: 1; }
        50% { opacity: 0.3; }
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
