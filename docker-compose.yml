version: '3.9'

services:
  api:
    build: .
    image: mission-control:latest
    ports:
      - "3000:3000"
    environment:
      PORT: "3000"
      DB_PATH: /data/mission-control.db
      DISABLE_AUTH: "false"
      NODE_ENV: production
    volumes:
      - mc-data:/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3000/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

volumes:
  mc-data:
    driver: local
